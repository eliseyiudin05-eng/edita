name: CI

on:
  push:
    branches: ["main", "backendGo"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  go-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kivronix
          POSTGRES_PASSWORD: kivronix_test
          POSTGRES_DB: kivronix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kivronix -d kivronix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GO_BACKEND_DATABASE_URL: postgresql://kivronix:kivronix_test@localhost:5432/kivronix?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            gofmt -d $files
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Apply PostgreSQL migrations twice
        run: go run ./cmd/migrate && go run ./cmd/migrate
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
