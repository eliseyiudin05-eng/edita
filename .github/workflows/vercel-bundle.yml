name: Build Vercel deployment bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build text bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          include_roots = {"app", "components", "lib"}
          include_files = {"package.json", "tsconfig.json", "next.config.ts", "next-env.d.ts"}
          files = []

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel == "vercel-deploy-bundle.json":
                  continue
              if path.parts[0] in include_roots or rel in include_files:
                  try:
                      data = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  files.append({"file": rel, "data": data, "encoding": "utf-8"})

          Path("vercel-deploy-bundle.json").write_text(
              json.dumps(files, ensure_ascii=False),
              encoding="utf-8",
          )
          print(f"Bundled {len(files)} files")
          PY

      - name: Commit bundle
        run: |
          git config user.name "edita-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vercel-deploy-bundle.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: build temporary Vercel deployment bundle"
          git push
