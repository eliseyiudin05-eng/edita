name: Build Vercel deployment bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build text bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots={"app","components","lib","public"}
          fileset={"package.json","package-lock.json","tsconfig.json","next.config.ts","next-env.d.ts","proxy.ts"}
          files=[]
          for p in sorted(Path(".").rglob("*")):
              if not p.is_file(): continue
              rel=p.as_posix()
              if rel=="vercel-deploy-bundle.json": continue
              if p.parts[0] in roots or rel in fileset:
                  try: data=p.read_text(encoding="utf-8")
                  except UnicodeDecodeError: continue
                  files.append({"file":rel,"data":data,"encoding":"utf-8"})
          Path("vercel-deploy-bundle.json").write_text(json.dumps(files,ensure_ascii=False),encoding="utf-8")
          print(f"Bundled {len(files)} files")
          PY
      - name: Commit bundle
        run: |
          git config user.name "edita-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vercel-deploy-bundle.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: build temporary Vercel deployment bundle"
          git push
