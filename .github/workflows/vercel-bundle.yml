name: Build Vercel deployment bundle
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "proxy.ts"
      - "vercel.json"
      - ".github/workflows/vercel-bundle.yml"
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          roots={"app","components","lib","scripts","public"}
          fileset={"package.json","package-lock.json","tsconfig.json","next.config.ts","next-env.d.ts","proxy.ts","vercel.json"}
          files=[]
          for p in sorted(Path(".").rglob("*")):
              if not p.is_file(): continue
              rel=p.as_posix()
              if rel=="vercel-deploy-bundle.json": continue
              if p.parts[0] in roots or rel in fileset:
                  try:
                      data=p.read_text(encoding="utf-8")
                      encoding="utf-8"
                  except UnicodeDecodeError:
                      data=base64.b64encode(p.read_bytes()).decode("ascii")
                      encoding="base64"
                  files.append({"file":rel,"data":data,"encoding":encoding})
          Path("vercel-deploy-bundle.json").write_text(json.dumps(files,ensure_ascii=False),encoding="utf-8")
          PY
      - name: Upload bundle without creating a second commit
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-bundle
          path: vercel-deploy-bundle.json
          if-no-files-found: error
          retention-days: 7
